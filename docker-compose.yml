services:
  api:
    image: systatus.live-api:latest
    container_name: systatus-live-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4003:3000"
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      TYPEORM_ENTITIES: ${TYPEORM_ENTITIES}
      TYPEORM_MIGRATIONS: ${TYPEORM_MIGRATIONS}
      QUERY_SIZE: ${QUERY_SIZE}
      JWT_KEY: ${JWT_KEY}
      ENCRYPT_KEY: ${ENCRYPT_KEY}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      RESEND_API_URL: ${RESEND_API_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      VERCEL_BLOB_READ_WRITE_TOKEN: ${VERCEL_BLOB_READ_WRITE_TOKEN}
      NODE_ENV: ${NODE_ENV}
      WEB_URL: ${WEB_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID_ANDORINHA: ${STRIPE_PRICE_ID_ANDORINHA}
      STRIPE_PRICE_ID_CORUJA: ${STRIPE_PRICE_ID_CORUJA}
      STRIPE_PRICE_ID_AGUIA: ${STRIPE_PRICE_ID_AGUIA}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY}
    restart: unless-stopped
