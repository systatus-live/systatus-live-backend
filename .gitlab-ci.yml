stages:
  - deploy-systatus-api
  - deploy-systatus-api-hml

deploy-systatus-api:
  environment:
    name: production
  stage: deploy-systatus-api
  tags:
    - systatus-runner
  script:
    - ssh-keyscan $DEPLOY_HOST >> /home/gitlab-runner/.ssh/known_hosts
    - docker build --no-cache -f Dockerfile.prod -t systatus-live-api:latest .
    - docker save systatus-live-api:latest | gzip | ssh $DEPLOY_USER@$DEPLOY_HOST "docker load"
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "cat > $DEPLOY_DIR/.env << 'EOF'
      DATABASE_HOST=$DATABASE_HOST
      DATABASE_PORT=$DATABASE_PORT
      DATABASE_USERNAME=$DATABASE_USERNAME
      DATABASE_PASSWORD=$DATABASE_PASSWORD
      DATABASE_NAME=$DATABASE_NAME
      JWT_KEY=$JWT_KEY
      ENCRYPT_KEY=$ENCRYPT_KEY
      NODE_ENV=$NODE_ENV
      WEB_URL=$WEB_URL
      RESEND_API_URL=$RESEND_API_URL
      RESEND_API_KEY=$RESEND_API_KEY
      STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY
      STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET
      STRIPE_PRICE_ID_CORUJA=$STRIPE_PRICE_ID_CORUJA
      STRIPE_PRICE_ID_AGUIA=$STRIPE_PRICE_ID_AGUIA
      GOOGLE_OAUTH_CLIENT_ID=$GOOGLE_OAUTH_CLIENT_ID
      WHATSAPP_PHONE_NUMBER_ID=$WHATSAPP_PHONE_NUMBER_ID
      WHATSAPP_API_KEY=$WHATSAPP_API_KEY
      CONTACT_EMAIL=$CONTACT_EMAIL
      VERCEL_BLOB_READ_WRITE_TOKEN=$VERCEL_BLOB_READ_WRITE_TOKEN
      TYPEORM_ENTITIES=$TYPEORM_ENTITIES
      TYPEORM_MIGRATIONS=$TYPEORM_MIGRATIONS
      QUERY_SIZE=$QUERY_SIZE
      NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
      EOF"
    - scp docker-compose.yml $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/docker-compose.yml
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_DIR && docker compose up -d systatus-live-api"
    - docker image prune -f
  only:
    - master

deploy-systatus-api-hml:
  environment:
    name: homolog
  stage: deploy-systatus-api-hml
  tags:
    - systatus-runner
  script:
    - docker compose build --no-cache systatus-live-api-hml
    - docker compose down systatus-live-api-hml
    - docker compose up -d systatus-live-api-hml
    - docker image prune -f
  only:
    - homolog
